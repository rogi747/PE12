name: PixelExperience 12 - star2lte Full ROM / Compressed Workspace Btrfs

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Build complete ROM by default; or run compression benchmark"
        type: choice
        required: true
        default: full_rom
        options:
          - benchmark
          - full_rom
      out_storage:
        description: "Full workspace (.repo + sources + out): Btrfs ZSTD (default) or plain"
        type: choice
        required: true
        default: btrfs_zstd
        options:
          - plain
          - btrfs_zstd

permissions:
  contents: read

concurrency:
  group: pe12-star2lte-rbe-full-rom-trial
  cancel-in-progress: true

jobs:
  rbe-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BUILDBUDDY_API_KEY: "${{ secrets.BUILDBUDDY_API_KEY }}"
      RUN_MODE: "${{ inputs.run_mode }}"
      OUT_STORAGE: "${{ inputs.out_storage }}"

      # BẬT LẠI RBE
      USE_RBE: "1"
      RBE_DIR: "prebuilts/remoteexecution-client/live"
      RBE_CXX_EXEC_STRATEGY: "remote_local_fallback"
      RBE_service: "127.0.0.1:19099"
      RBE_service_no_security: "true"
      RBE_service_no_auth: "true"
      RBE_use_application_default_credentials: "false"
      RBE_use_rpc_credentials: "false"

      # ÉP RBE KHÔNG LƯU LOG ĐỂ CỨU Ổ CỨNG
      RBE_log_dir: "/tmp/rbe-test"
      RBE_log_path: "text:///tmp/rbe-test/reproxy_log.txt"
      RBE_proxy_log_dir: ""
      RBE_reproxy_wait_seconds: "30"
      RBE_v: "0"
      RBE_log_format: "reduced"

      NINJA_REMOTE_NUM_JOBS: "16"
      NINJA_HIGHMEM_NUM_JOBS: "1"

      DISK_WARN_GIB: "15"
      DISK_STOP_GIB: "1"
      BTRFS_WORKSPACE_IMAGE_GIB: "220"
      FULL_ROM_SOFT_DEADLINE_MINUTES: "350"

    steps:
      - name: Reclaim root disk & Setup Swap
        shell: bash
        run: |
          set -e
          
          echo "=== DỌN SẠCH CÁC PHẦN MỀM GITHUB RUNNER ĐỂ CỨU DISK ==="
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /usr/local/graalvm \
            /usr/share/rust \
            /usr/share/php* \
            /usr/local/share/vcpkg \
            /usr/local/go \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /usr/share/miniconda \
            /usr/local/aws-cli \
            /usr/local/bin/aws* || true
            
          sudo docker image prune -a -f >/dev/null 2>&1 || true
          sudo apt-get clean

          echo "=== CẤP PHÁT 8GB SWAP ==="
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          mkdir -p /home/runner/work/pe /tmp/rbe-test
          date +%s > /tmp/rbe-test/job-start-epoch.txt
          df -h /

      - name: Checkout local manifest
        uses: actions/checkout@v4
        with:
          path: repo-config

      - name: Install build dependencies
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -e
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential curl flex g++-multilib gcc-multilib git \
            git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools btrfs-progs xsltproc \
            zip zlib1g-dev python3 python-is-python3 openjdk-11-jdk-headless \
            ninja-build nginx ca-certificates openssl unzip

          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Prepare Btrfs ZSTD compressed Android workspace
        working-directory: /home/runner/work
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE=/home/runner/work/pe
          BACKING=/tmp/pe-workspace-btrfs.img
          mkdir -p /tmp/rbe-test "$WORKSPACE"
          truncate -s "${BTRFS_WORKSPACE_IMAGE_GIB}G" "$BACKING"
          sudo mkfs.btrfs -f -m single -d single "$BACKING"
          # Ép nén BTRFS cấp độ 3 để mã nguồn nhỏ gọn nhất có thể
          sudo mount -t btrfs -o loop,compress-force=zstd:3,noatime,space_cache=v2 "$BACKING" "$WORKSPACE"
          sudo chown "$(id -u):$(id -g)" "$WORKSPACE"

      - name: Repo init and sync
        working-directory: /home/runner/work/pe
        timeout-minutes: 120
        shell: bash
        run: |
          set -eo pipefail
          git config --global user.email "ci@local"
          git config --global user.name "ci"
          git config --global color.ui false
          git lfs install --skip-repo

          repo init --depth=1 --git-lfs -u https://github.com/PE12-Legacy/manifest -b twelve-plus
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/repo-config/.repo-local-manifests/star2lte.xml" ".repo/local_manifests/star2lte.xml"

          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j"$(nproc)" || \
          repo sync -c --no-clone-bundle --no-tags --prune -j4

      - name: Install compatible reclient 0.57.0 (pinned AOSP)
        working-directory: /home/runner/work/pe
        shell: bash
        run: |
          set -euo pipefail
          PINNED_COMMIT="5148d33653fe6920633e405fd990b525f5bce912"
          PINNED_VERSION="0.57.0.4865132"
          DEST="prebuilts/remoteexecution-client/compat-${PINNED_VERSION}"
          FETCH_DIR="$RUNNER_TEMP/reclient-pinned"
          mkdir -p "$FETCH_DIR" "$DEST"
          git -C "$FETCH_DIR" init -q
          git -C "$FETCH_DIR" remote add origin https://android.googlesource.com/platform/prebuilts/remoteexecution-client
          git -C "$FETCH_DIR" config core.sparseCheckout true
          printf '%s\n' "/${PINNED_VERSION}/" > "$FETCH_DIR/.git/info/sparse-checkout"
          git -C "$FETCH_DIR" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$PINNED_COMMIT"
          git -C "$FETCH_DIR" checkout -q --detach FETCH_HEAD
          cp -r "$FETCH_DIR/$PINNED_VERSION/." "$DEST/"
          echo "RBE_DIR=$DEST" >> "$GITHUB_ENV"

      - name: Start BuildBuddy bridge
        working-directory: /home/runner/work/pe
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE_DIR="/tmp/buildbuddy-rbe-bridge"
          install -d -m 700 "$BRIDGE_DIR" /tmp/rbe-test
          python3 - <<'PYBRIDGE'
          import os
          from pathlib import Path
          secret = os.environ['BUILDBUDDY_API_KEY']
          encoded = secret.replace('\\', '\\\\').replace('"', '\\"')
          config = '''worker_processes 1;
          pid /tmp/buildbuddy-rbe-bridge/nginx.pid;
          events { worker_connections 1024; }
          http {
            access_log off;
            server {
              listen 127.0.0.1:19099 http2;
              location / {
                grpc_pass grpcs://remote.buildbuddy.io:443;
                grpc_ssl_server_name on;
                grpc_ssl_name remote.buildbuddy.io;
                grpc_ssl_verify on;
                grpc_ssl_verify_depth 5;
                grpc_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
                grpc_set_header x-buildbuddy-api-key "__BUILDBUDDY_KEY__";
              }
            }
          }
          '''.replace('__BUILDBUDDY_KEY__', encoded)
          Path('/tmp/buildbuddy-rbe-bridge/nginx.conf').write_text(config)
          PYBRIDGE
          nginx -c "$BRIDGE_DIR/nginx.conf"
          sleep 2

      - name: Configure PixelExperience and build full star2lte ROM
        working-directory: /home/runner/work/pe
        timeout-minutes: 325
        shell: bash
        run: |
          set -eo pipefail

          source build/envsetup.sh
          lunch aosp_starlte-userdebug

          if [ -x "$PWD/prebuilts/jdk/jdk11/linux-x86/bin/java" ]; then
            export JAVA_HOME="$PWD/prebuilts/jdk/jdk11/linux-x86"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          export RBE_exec_root="$(dirname "$(pwd -P)")"

          if [ ! -d "kernel/prebuilts/common-modules/virtual-device/5.10/arm64" ]; then
            git clone https://android.googlesource.com/kernel/prebuilts/common-modules/virtual-device/5.10/arm64 \
              kernel/prebuilts/common-modules/virtual-device/5.10/arm64 --depth=1
          fi

          echo "=== TẠO ĐỒ THỊ SOONG ==="
          m nothing 2>&1 | tee /tmp/rbe-test/m-nothing.log

          echo "=== XÓA SẠCH DỮ LIỆU .repo VÀ .git CỦA PREBUILTS ĐỂ CỨU Ổ CỨNG ==="
          # Giả lập repo tool
          rm -f /home/runner/work/pe/.repo/repo/repo || true
          cat << 'EOF' > /home/runner/work/pe/.repo/repo/repo
          #!/usr/bin/env python3
          print('<?xml version="1.0" encoding="UTF-8"?><manifest></manifest>')
          EOF
          chmod +x /home/runner/work/pe/.repo/repo/repo

          # Phá hủy .repo (giúp giải phóng ~15GB)
          find /home/runner/work/pe/.repo -mindepth 1 -maxdepth 1 ! -name 'repo' -exec rm -rf {} + || true
          # Phá hủy lịch sử Git của Toolchain (giúp giải phóng ~3GB)
          find prebuilts external/chromium-webview -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          # Worker xóa rác RBE chạy ngầm mỗi phút
          (
            while true; do
              rm -f /tmp/rbe-test/*.rrpl /tmp/rbe-test/*.INFO* 2>/dev/null || true
              sleep 60
            done
          ) &
          SYMBOL_KILLER_PID=$!

          BUILD_LOG=/tmp/rbe-test/full-rom-build.log
          BUILD_STATUS_FILE=/tmp/rbe-test/build-exit-code.txt
          rm -f "$BUILD_STATUS_FILE"

          (
            set +e
            set -o pipefail
            export SKIP_SOONG_TESTS=true
            export GOGC=45
            export ANDROID_PGO_NO_PROFILE_USE=true
            export SKIP_ABI_CHECKS=true
            
            m -j3 bacon 2>&1 | tee "$BUILD_LOG"
            rc=${PIPESTATUS[0]}
            printf '%s\n' "$rc" > "$BUILD_STATUS_FILE"
            exit "$rc"
          ) &
          BUILD_PID=$!

          wait "$BUILD_PID"
          BUILD_RC=$?
          if [ -s "$BUILD_STATUS_FILE" ]; then BUILD_RC="$(cat "$BUILD_STATUS_FILE")"; fi
          kill $SYMBOL_KILLER_PID 2>/dev/null || true

          if [ "$BUILD_RC" -ne 0 ]; then
            tail -n 120 "$BUILD_LOG" || true
            exit "$BUILD_RC"
          fi

          ROM_DIR="$ANDROID_BUILD_TOP/out/target/product/starlte"
          ROM_ZIP="$(find "$ROM_DIR" -maxdepth 1 -type f -name '*.zip' | head -1)"
          if [ -z "$ROM_ZIP" ]; then exit 1; fi
          sha256sum "$ROM_ZIP" > /tmp/rbe-test/rom-sha256.txt

      - name: Upload completed PixelExperience ROM
        if: ${{ success() && inputs.run_mode == 'full_rom' }}
        uses: actions/upload-artifact@v4
        with:
          name: pe12-starlte-${{ github.run_id }}
          path: /home/runner/work/pe/out/target/product/starlte/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
